name: Local macOS compatibility candidate
on:
  workflow_dispatch:
    inputs:
      runner:
        description: ARM Mac26 or Mac15 build fallback; Intel is never ARM native acceptance
        type: choice
        options:
          - macos-26
          - macos-15
          - macos-26-intel
        default: macos-26
      cross_compile_arm64:
        description: Intel host tests plus ARM BUILD_ONLY artifact; ARM execution stays pending
        type: boolean
        default: false
      arm_setup_only:
        description: ARM setup BUILD_ONLY stage; both full profiles and native acceptance stay pending
        type: boolean
        default: false
      source_checks_only:
        description: Source and signer component checks only; no app build, full profile or native acceptance
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  candidate:
    # Never accept an arbitrary self-hosted runner label from a dispatch input.
    runs-on: ${{ inputs.runner == 'macos-15' && 'macos-15' || inputs.runner == 'macos-26-intel' && 'macos-26-intel' || 'macos-26' }}
    # A full Intel build/profile plus the full ARM cross-build exceeded45min
    # after the host suite passed. Keep all tests and their own bounds intact.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested route
        env:
          PARROT_REQUESTED_RUNNER: ${{ inputs.runner }}
          PARROT_CROSS_ROUTE: ${{ inputs.cross_compile_arm64 }}
          PARROT_SETUP_ROUTE: ${{ inputs.arm_setup_only }}
          PARROT_SOURCE_ROUTE: ${{ inputs.source_checks_only }}
        run: |
          if [[ "$PARROT_CROSS_ROUTE" == true || "$PARROT_SETUP_ROUTE" == true || "$PARROT_SOURCE_ROUTE" == true ]]; then
            test "$PARROT_REQUESTED_RUNNER" = macos-26-intel
            test "$PARROT_CROSS_ROUTE/$PARROT_SETUP_ROUTE" != true/true
            if [[ "$PARROT_SOURCE_ROUTE" == true ]]; then
              test "$PARROT_CROSS_ROUTE/$PARROT_SETUP_ROUTE" = false/false
            fi
          fi
      # The ARM macOS15 image defaults to an older SDK. Select the documented
      # Xcode26 toolchain explicitly; never silently fall back or skip tests.
      - name: Select ARM fallback toolchain
        if: inputs.runner == 'macos-15'
        run: |
          test "$(uname -m)" = arm64
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.2
      - name: Select Intel cross-build toolchain
        if: inputs.cross_compile_arm64 || inputs.arm_setup_only || inputs.source_checks_only
        env:
          PARROT_REQUESTED_RUNNER: ${{ inputs.runner }}
        run: |
          test "$PARROT_REQUESTED_RUNNER" = macos-26-intel
          test "$(uname -m)" = x86_64
          test -d /Applications/Xcode_26.6.app/Contents/Developer
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.5
      - name: Verify source-grounded context and canonical evidence
        run: |
          set -o pipefail
          mkdir source-grounded-evidence
          git fetch --no-tags --depth=1 origin ed9934a7938a3fb2c60975e298a4c6a2359437d7
          python3 -B scripts/test-document-review-context.py | tee source-grounded-evidence/document-review-context.log
          python3 -B scripts/test-reviewed-facts.py | tee source-grounded-evidence/reviewed-facts.log
          python3 -B scripts/test-catalog-signer.py | tee source-grounded-evidence/catalog-signer.log
          python3 -B scripts/test-profile-runner.py | tee source-grounded-evidence/profile-runner.log
          python3 -B scripts/test-automatic-credential-policy.py | tee source-grounded-evidence/automatic-credential-policy.log
          python3 -B scripts/test-export-repository-knowledge.py 2>&1 | tee source-grounded-evidence/repository-export.log
          swiftc -parse-as-library -target "$(uname -m)-apple-macosx14.0" -sdk "$(xcrun --sdk macosx --show-sdk-path)" Parrot/Services/RepositoryKnowledge.swift scripts/repository-knowledge-test.swift -o source-grounded-evidence/repository-component-tests
          source-grounded-evidence/repository-component-tests | tee source-grounded-evidence/repository-components.log
          if [[ '${{ inputs.cross_compile_arm64 }}' == true || '${{ inputs.arm_setup_only }}' == true || '${{ inputs.source_checks_only }}' == true ]]; then
            swiftc -parse-as-library -target arm64-apple-macosx14.0 -sdk "$(xcrun --sdk macosx --show-sdk-path)" scripts/catalog-sign.swift -o source-grounded-evidence/catalog-signer-arm64
            shasum -a 256 source-grounded-evidence/catalog-signer-arm64 > source-grounded-evidence/catalog-signer-arm64.sha256
          fi
          python3 -B scripts/test-redacted-evidence-roundtrip.py --source-ref ed9934a7938a3fb2c60975e298a4c6a2359437d7 --expect-red | tee source-grounded-evidence/redacted-evidence-before.log
          python3 -B scripts/test-redacted-evidence-roundtrip.py | tee source-grounded-evidence/redacted-evidence-after.log
          python3 -B scripts/probe-mcp-bundle.py | tee source-grounded-evidence/mcp-bundle-probe.log
      - uses: actions/cache@v4
        # Do not share Mac26 compiled objects with the different host/toolchain.
        if: inputs.runner != 'macos-15' && !inputs.cross_compile_arm64 && !inputs.arm_setup_only && !inputs.source_checks_only
        with:
          path: .build
          key: local-compat-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
      # Same prerequisite as upstream CI: a fresh runner lacks the optional
      # NaturalLanguage embedding assets used by the offline logic harness.
      - name: Prepare offline embedding assets
        if: ${{ !inputs.arm_setup_only && !inputs.source_checks_only }}
        timeout-minutes: 6
        continue-on-error: true
        run: |
          cat > /tmp/parrot-embedding-assets.swift <<'SWIFT'
          import Foundation
          import NaturalLanguage
          let done = DispatchSemaphore(value: 0)
          for lang in [NLLanguage.english, .turkish] {
              guard let model = NLContextualEmbedding(language: lang) else { continue }
              if model.hasAvailableAssets { continue }
              model.requestAssets { result, error in
                  print("\(lang.rawValue): \(result.rawValue) \(error?.localizedDescription ?? "")")
                  done.signal()
              }
              _ = done.wait(timeout: .now() + 120)
          }
          SWIFT
          swift /tmp/parrot-embedding-assets.swift
      - name: Build and verify candidate
        if: ${{ !inputs.source_checks_only }}
        env:
          PARROT_CROSS_COMPILE_ARM64: ${{ inputs.cross_compile_arm64 }}
          PARROT_ARM_SETUP_ONLY: ${{ inputs.arm_setup_only }}
        run: |
          if [[ "$PARROT_ARM_SETUP_ONLY" == true ]]; then
            bash scripts/build-arm-setup-candidate.sh
          else
            if [[ "$PARROT_CROSS_COMPILE_ARM64" == true ]]; then
              python3 -B scripts/test-arm-cross-candidate.py
            fi
            bash scripts/build-local-candidate.sh
            if [[ "$PARROT_CROSS_COMPILE_ARM64" == true ]]; then
              bash scripts/build-arm-cross-candidate.sh
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.source_checks_only && 'source-and-signer-checks-only' || inputs.arm_setup_only && 'arm-setup-build-only-candidate' || inputs.cross_compile_arm64 && 'arm-cross-build-only-candidate' || 'local-macos-candidate' }}
          path: |
            Parrot-local-candidate.zip
            Parrot-arm64-build-only.zip
            Parrot-arm64-setup-only.zip
            build-evidence/
            source-grounded-evidence/
          retention-days: 7
