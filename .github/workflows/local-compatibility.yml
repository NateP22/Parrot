name: Local macOS compatibility candidate
on:
  workflow_dispatch:
    inputs:
      runner:
        description: ARM Mac26 or Mac15 build fallback; Intel is never ARM native acceptance
        type: choice
        options:
          - macos-26
          - macos-15
          - macos-26-intel
        default: macos-26
permissions:
  contents: read
jobs:
  candidate:
    # Never accept an arbitrary self-hosted runner label from a dispatch input.
    runs-on: ${{ inputs.runner == 'macos-15' && 'macos-15' || inputs.runner == 'macos-26-intel' && 'macos-26-intel' || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The ARM macOS15 image defaults to an older SDK. Select the documented
      # Xcode26 toolchain explicitly; never silently fall back or skip tests.
      - name: Select ARM fallback toolchain
        if: inputs.runner == 'macos-15'
        run: |
          test "$(uname -m)" = arm64
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.2
      - uses: actions/cache@v4
        # Do not share Mac26 compiled objects with the different host/toolchain.
        if: inputs.runner != 'macos-15'
        with:
          path: .build
          key: local-compat-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
      # Same prerequisite as upstream CI: a fresh runner lacks the optional
      # NaturalLanguage embedding assets used by the offline logic harness.
      - name: Prepare offline embedding assets
        timeout-minutes: 6
        continue-on-error: true
        run: |
          cat > /tmp/parrot-embedding-assets.swift <<'SWIFT'
          import Foundation
          import NaturalLanguage
          let done = DispatchSemaphore(value: 0)
          for lang in [NLLanguage.english, .turkish] {
              guard let model = NLContextualEmbedding(language: lang) else { continue }
              if model.hasAvailableAssets { continue }
              model.requestAssets { result, error in
                  print("\(lang.rawValue): \(result.rawValue) \(error?.localizedDescription ?? "")")
                  done.signal()
              }
              _ = done.wait(timeout: .now() + 120)
          }
          SWIFT
          swift /tmp/parrot-embedding-assets.swift
      - name: Build and verify candidate
        run: bash scripts/build-local-candidate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-macos-candidate
          path: |
            Parrot-local-candidate.zip
            build-evidence/
          retention-days: 7
